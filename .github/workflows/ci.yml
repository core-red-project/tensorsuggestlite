name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0

      - name: Validate PR commit range
        run: |
          scripts/check-commit-range.sh origin/${{ github.base_ref }} HEAD

  quality-gate:
    name: Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Setup uv
        uses: astral-sh/setup-uv@168843c089c1f6d3575971488c5ef93cb1fa940e # v5.1.0
        with:
          enable-cache: true

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.40.0"

      - name: Pin Python
        run: uv python install 3.11

      - name: Install dependencies
        run: just install

      - name: Run Quality Gate (format-check, lint, typecheck, test)
        run: just check

      - name: Build Package Artifacts
        run: just build
