name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Wheel & Source Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup just
        uses: taiki-e/install-action@just

      - name: Pin Python
        run: uv python install 3.11

      - name: Install dependencies
        run: just install

      - name: Run Quality Verification
        run: just check

      - name: Build Python packages
        run: just build

      - name: Upload python distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-bundles:
    name: Build Native Bundles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: windows-latest
          - os: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup just
        uses: taiki-e/install-action@just

      - name: Pin Python
        run: uv python install 3.11

      - name: Install dependencies
        run: just install

      - name: Build standalone bundles (Desktop & CLI)
        run: just bundle

      - name: Package macOS Assets
        if: matrix.os == 'macos-14'
        run: |
          just dmg
          cp dist/TensorSuggestLite.dmg dist/TensorSuggestLite-macOS.dmg
          cp dist/tensorsuggestlite-cli/tensorsuggestlite-cli dist/tensorsuggestlite-cli-macOS

      - name: Package Windows Assets
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp dist/TensorSuggestLite/TensorSuggestLite.exe dist/TensorSuggestLite-Desktop-Windows.exe
          cp dist/tensorsuggestlite-cli/tensorsuggestlite-cli.exe dist/tensorsuggestlite-cli-Windows.exe

      - name: Package Linux Assets
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp dist/TensorSuggestLite/TensorSuggestLite dist/TensorSuggestLite-Desktop-Linux
          cp dist/tensorsuggestlite-cli/tensorsuggestlite-cli dist/tensorsuggestlite-cli-Linux

      - name: Upload bundle assets
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            dist/TensorSuggestLite-*
            dist/tensorsuggestlite-cli-*


  publish-release:
    name: Publish GitHub Release
    needs: [build-packages, build-bundles]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release with Bundles
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
