name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify Tag Matches pyproject.toml
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Version Tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Triggered via workflow_dispatch; skipping strict tag equality check."
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          MANIFEST_VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -1)
          echo "Release tag version: $TAG_VERSION"
          echo "Manifest version:    $MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: Git tag ($TAG_VERSION) does not match pyproject.toml version ($MANIFEST_VERSION)" >&2
            exit 1
          fi

  build-packages:
    name: Build Wheel & Source Distribution
    needs: [verify-version]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.40.0"

      - name: Pin Python
        run: uv python install 3.11

      - name: Install dependencies
        run: just install

      - name: Run Quality Verification (Gate)
        run: just check

      - name: Build Python packages
        run: just build

      - name: Upload python distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/*
          retention-days: 1

  build-bundles:
    name: Build Standalone Bundles (${{ matrix.target }})
    needs: [verify-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build_gui: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build_gui: false
          - os: macos-15
            target: aarch64-apple-darwin
            build_gui: true
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            build_gui: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.40.0"

      - name: Pin Python
        run: uv python install 3.11

      - name: Install dependencies
        run: just install

      - name: Build Standalone CLI Binary
        run: just bundle-cli

      - name: Build Desktop GUI Bundle
        if: matrix.build_gui
        run: just bundle-desktop

      - name: Package Release Assets (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -1)
          fi
          TARGET="${{ matrix.target }}"
          mkdir -p release-dist

          # Package Standalone CLI
          mkdir -p staging-cli
          cp dist/tensorsuggestlite-cli staging-cli/
          cp README.md LICENSE* staging-cli/
          tar -czf "release-dist/tensorsuggestlite-cli-${VERSION}-${TARGET}.tar.gz" -C staging-cli tensorsuggestlite-cli README.md LICENSE*
          rm -rf staging-cli

          # Package Desktop GUI (if enabled)
          if [ "${{ matrix.build_gui }}" = "true" ]; then
            if [ "${{ matrix.os }}" = "macos-15" ]; then
              just dmg
              cp dist/TensorSuggestLite.dmg "release-dist/tensorsuggestlite-gui-${VERSION}-${TARGET}.dmg"
            else
              mkdir -p staging-gui
              cp -r dist/TensorSuggestLite staging-gui/
              cp README.md LICENSE* staging-gui/
              tar -czf "release-dist/tensorsuggestlite-gui-${VERSION}-${TARGET}.tar.gz" -C staging-gui TensorSuggestLite README.md LICENSE*
              rm -rf staging-gui
            fi
          fi

      - name: Package Release Assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -1)
          fi
          TARGET="${{ matrix.target }}"
          mkdir -p release-dist

          # Package Standalone CLI (Windows .zip)
          mkdir -p staging-cli
          cp dist/tensorsuggestlite-cli.exe staging-cli/
          cp README.md LICENSE* staging-cli/
          (cd staging-cli && python -m zipfile -c "../release-dist/tensorsuggestlite-cli-${VERSION}-${TARGET}.zip" *)
          rm -rf staging-cli

          # Package Desktop GUI (Windows .zip)
          if [ "${{ matrix.build_gui }}" = "true" ]; then
            mkdir -p staging-gui
            cp -r dist/TensorSuggestLite staging-gui/
            cp README.md LICENSE* staging-gui/
            (cd staging-gui && python -m zipfile -c "../release-dist/tensorsuggestlite-gui-${VERSION}-${TARGET}.zip" *)
            rm -rf staging-gui
          fi

      - name: Upload bundle assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.target }}
          path: release-dist/*
          retention-days: 1

  publish-pypi:
    name: Publish to PyPI
    needs: [build-packages, build-bundles]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/tensorsuggestlite
    permissions:
      id-token: write
    steps:
      - name: Download python distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Publish to PyPI via OIDC / Trusted Publishing
        run: uv publish dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-packages, build-bundles]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all release bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: bundles-*
          merge-multiple: true

      - name: Download python distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: release-assets

      - name: Generate Checksums (SHA256SUMS)
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release with Bundles and Checksums
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release-assets/*
          generate_release_notes: true
