name: Build Validation

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  validate-build-scripts:
    name: Validate Build Scripts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate shell scripts syntax
      run: |
        if [ -f build_mac_app.sh ]; then
          bash -n build_mac_app.sh
          echo "build_mac_app.sh syntax valid"
        fi
        
        if [ -f build_windows_exe.sh ]; then
          bash -n build_windows_exe.sh
          echo "build_windows_exe.sh syntax valid"
        fi

    - name: Check script permissions
      run: |
        if [ -f build_mac_app.sh ] && [ ! -x build_mac_app.sh ]; then
          echo "WARNING: build_mac_app.sh not executable"
          chmod +x build_mac_app.sh
        fi
        
        if [ -f build_windows_exe.sh ] && [ ! -x build_windows_exe.sh ]; then
          echo "WARNING: build_windows_exe.sh not executable"
          chmod +x build_windows_exe.sh
        fi

  test-imports:
    name: Test Python Imports
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 PyYAML toml

    - name: Test imports without TensorFlow
      run: |
        python -c "from json_interpreter import trainer; print('json_interpreter import OK')"
        python -c "from yaml_interpreter import trainer; print('yaml_interpreter import OK')"
        python -c "from toml_interpreter import trainer; print('toml_interpreter import OK')"
        echo "All imports successful without TensorFlow"

    - name: Install TensorFlow and test full imports
      run: |
        pip install tensorflow numpy scikit-learn

    - name: Test training functions importable
      run: |
        python -c "from json_interpreter.trainer import train_from_json, convert_to_tflite; print('JSON trainer functions OK')"
        python -c "from yaml_interpreter.trainer import train_from_yaml, convert_to_tflite; print('YAML trainer functions OK')"
        python -c "from toml_interpreter.trainer import train_from_toml, convert_to_tflite; print('TOML trainer functions OK')"
        echo "All trainer functions importable"

