name: Python Lint and Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy
        pip install -r requirements-pinned.txt

    - name: Run flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings, max line length 100
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Check code formatting with black
      run: |
        black --check --line-length 100 --exclude '/(\.git|\.venv|\.venv_build|build|dist)/' .

    - name: Run mypy type checking
      run: |
        mypy --ignore-missing-imports --no-strict-optional tensorsuggestlite.py
        mypy --ignore-missing-imports --no-strict-optional json_interpreter/ toml_interpreter/ yaml_interpreter/
      continue-on-error: true  # Type hints being added gradually

  validate:
    name: Validate Project Structure
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check required files exist
      run: |
        files=(
          "README.md"
          "LICENSE"
          "CONTRIBUTING.md"
          "CODE_OF_CONDUCT.md"
          "SECURITY.md"
          "CHANGELOG.md"
          "requirements.txt"
          "requirements-pinned.txt"
          "tensorsuggestlite.py"
        )
        
        for file in "${files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "ERROR: Required file missing: $file"
            exit 1
          fi
        done
        
        echo "All required files present"

    - name: Validate JSON test data
      run: |
        python -m json.tool test/question_data.json > /dev/null
        echo "JSON test data is valid"

    - name: Check for common security issues
      run: |
        # Check for accidentally committed secrets or credentials
        if grep -r -i "password\s*=\s*['\"]" --include="*.py" .; then
          echo "WARNING: Possible hardcoded password found"
          exit 1
        fi
        
        if grep -r -E "api[_-]?key\s*=\s*['\"]" --include="*.py" .; then
          echo "WARNING: Possible hardcoded API key found"
          exit 1
        fi
        
        echo "Basic security checks passed"

