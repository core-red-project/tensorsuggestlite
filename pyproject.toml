[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensorsuggestlite"
version = "2.0.0"
description = "Configuration-driven text classification models with TensorFlow/Keras and TFLite export"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [
    { name = "HoujouSxnnyside", email = "houjou.sxnnyside@sxnnysideproject.com" }
]
dependencies = [
    "tensorflow>=2.15.0",
    "numpy>=1.24.0,<2.0.0",
    "scikit-learn>=1.5.0",
    "PyYAML>=6.0.0",
    "toml>=0.10.0",
]

[project.scripts]
tensorsuggestlite = "tensorsuggestlite.main:main"

[project.optional-dependencies]
gui = [
    "PyQt6>=6.6.0",
]
dev = [
    "PyQt6>=6.6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pre-commit>=3.7.0",
    "pyinstaller>=6.0.0",
]

[dependency-groups]
dev = [
    "PyQt6>=6.6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pre-commit>=3.7.0",
    "pyinstaller>=6.0.0",
]


[tool.hatch.build.targets.wheel]
packages = [
    "src/tensorsuggestlite",
]
include = [
    "styles",
    "icons",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "generated",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
