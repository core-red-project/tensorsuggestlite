[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensorsuggestlite"
version = "2.1.0"
description = "Configuration-driven text classification models with TensorFlow/Keras and TFLite export"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT AND MPL-2.0"
authors = [
    { name = "Core Red Project" }
]
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/core-red-project/tensorsuggestlite"
Repository = "https://github.com/core-red-project/tensorsuggestlite"
Issues = "https://github.com/core-red-project/tensorsuggestlite/issues"

[project.scripts]
tensorsuggestlite = "tensorsuggestlite.main:main"

[project.optional-dependencies]
train = [
    "tensorflow>=2.15.0",
    "scikit-learn>=1.5.0",
]
gui = [
    "dearpygui>=2.0.0",
]
full = [
    "tensorflow>=2.15.0",
    "scikit-learn>=1.5.0",
    "dearpygui>=2.0.0",
]

[dependency-groups]
dev = [
    "tensorflow>=2.15.0",
    "scikit-learn>=1.5.0",
    "dearpygui>=2.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pre-commit>=3.7.0",
    "pyinstaller>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/tensorsuggestlite",
]
include = [
    "icons",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "generated",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in argument defaults
    "N806",  # variable in function should be lowercase (math matrix notations X_train, y_train)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "dearpygui.*",
    "tensorflow.*",
    "sklearn.*",
    "yaml.*",
    "toml.*",
    "ai_edge_litert.*",
    "tflite_runtime.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -v"
